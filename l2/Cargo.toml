# =============================================================================
# Cargo.toml — Workspace L2 (rollup ZK)
# Encaja en: capa Networks entre L3 (SDK) y L1 (nodo C++).
# =============================================================================
[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/sequencer",
    "crates/executor",
    "crates/prover",
    "crates/da",
    "crates/bridge",
    "crates/rpc",
    "contracts/rollup_bridge",
    "tests",
]
default-members = ["crates/sequencer", "crates/rpc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Blockchain 4 Capas"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
parking_lot = "0.12"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
